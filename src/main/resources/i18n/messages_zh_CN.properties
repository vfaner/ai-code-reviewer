ci.created.hint.generic=配置方式：在 CI 脚本里向上面的地址 POST JSON（repoUrl/branch/commitId），并在请求头携带：\nAuthorization: Bearer 上面的密钥\n也可 POST multipart ZIP 到「上面地址 + /upload」（file 字段），鉴权方式相同。
